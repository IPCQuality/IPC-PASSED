<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Soft background circle / drop protection for dark & light tabs -->
  <circle cx="32" cy="32" r="30" fill="#ffffff" />
  
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-left Arc: Blue (#4285F4) -->
    <path d="M 28 12 A 15 15 0 0 0 13 27" stroke="#4285F4" stroke-width="5" />
    
    <!-- Bottom-left Arc: Red (#EA4335) -->
    <path d="M 13 27 A 15 15 0 0 0 28 42" stroke="#EA4335" stroke-width="5" />
    
    <!-- Bottom-right Arc: Yellow (#FBBC05) -->
    <path d="M 28 42 A 15 15 0 0 0 43 27" stroke="#FBBC05" stroke-width="5" />
    
    <!-- Top-right Arc: Green (#34A853) -->
    <path d="M 43 27 A 15 15 0 0 0 28 12" stroke="#34A853" stroke-width="5" />
    
    <!-- Center reflection / glass highlight -->
    <path d="M 20 20 A 10 10 0 0 1 28 16" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    
    <!-- Magnifier Handle: Blue (#4285F4) angled at 45 deg -->
    <path d="M 39 38 L 52 51" stroke="#4285F4" stroke-width="6" stroke-linecap="round" />
    
    <!-- Handle Accent Ring: Red / Yellow tip -->
    <path d="M 47 46 L 52 51" stroke="#EA4335" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>